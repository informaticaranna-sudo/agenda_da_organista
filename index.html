<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organista no Ritmo</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#121212">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Organista">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{--bg:#121212;--card:#1e1e1e;--tx:#f3dede;--mut:#9a9a9a;--pk:#f06292;--ok:#6ee7b7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Roboto,system-ui,sans-serif;padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:20px}
h1{font-size:26px;margin:4px 0}h2{font-size:20px;margin:24px 0 12px}
.eyebrow{color:var(--pk);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.mut{color:var(--mut);font-size:14px}
input,textarea{width:100%;background:var(--card);color:var(--tx);border:0;border-radius:14px;padding:15px;font:inherit;margin-bottom:12px}
textarea{min-height:110px;resize:vertical}
button{font:inherit;cursor:pointer}
.btn{width:100%;background:var(--pk);color:#3a0a1c;border:0;border-radius:14px;padding:14px;font-weight:700}
.link{background:none;border:0;color:var(--pk);margin-top:16px;width:100%}
.hero{background:var(--pk);color:#fff;border-radius:28px;padding:24px;margin-top:18px}
.hero b{font-size:44px;margin-right:10px}
.hero button{background:#fff;color:var(--pk);border:0;border-radius:12px;padding:10px 18px;font-weight:700;margin-top:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:0;border-radius:20px;height:130px;color:var(--mut);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tile b{font-size:22px}
.row{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px}
.ico{width:40px;height:40px;border-radius:50%;background:#46262f;color:var(--pk);display:grid;place-items:center;flex:none}
.row .t{flex:1}.row .t b{display:block;font-size:17px}.row .t span{color:var(--mut);font-size:13px}
.mk{background:none;border:0;color:var(--mut);font-weight:700}
.mk.done{color:var(--ok)}
.grp{color:var(--pk);font-weight:700;margin:20px 0 10px}
.seg{display:flex;border:1px solid #666;border-radius:99px;overflow:hidden;margin-bottom:18px}
.seg button{flex:1;background:none;border:0;color:var(--tx);padding:11px 4px;font-size:14px}
.seg .on{background:var(--pk);color:#fff}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 8px}
.back{background:none;border:0;color:var(--pk);padding:0;margin-bottom:8px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px 0}
nav button{background:none;border:0;color:var(--mut);font-size:13px;padding:6px 16px}
nav .on{color:var(--pk);font-weight:700}
.hist{background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.out{background:none;border:0;color:var(--tx);font-size:22px}

.meses{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.mes{background:var(--card);border-radius:16px;padding:12px}
.mes b{display:block;margin-bottom:8px;color:var(--pk)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.wd{font-style:normal;font-size:10px;color:var(--mut)}
.dia{aspect-ratio:1;border:0;border-radius:50%;background:none;color:var(--tx);font-size:12px;padding:0;position:relative}
.dia.sim{background:#1f6f54;color:#fff}.dia.nao{background:#7a2a2a;color:#fff}
.dia.hj{outline:2px solid var(--pk)}
.dia.nt::after{content:"";position:absolute;right:3px;top:3px;width:5px;height:5px;border-radius:50%;background:#fff}
.leg{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:10px 0 16px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
#print{display:none}
@media print{body{background:#fff;color:#000;padding:0}main,nav{display:none!important}
#print{display:block;font-family:Arial,sans-serif;font-size:12px}
#print table{width:100%;border-collapse:collapse;margin-bottom:16px}
#print td,#print th{border:1px solid #999;padding:4px 6px;text-align:left;vertical-align:top}
#print h1{font-size:20px}#print h2{font-size:15px;margin:16px 0 6px}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav" hidden></nav>
<div id="print"></div>

<script>
/* ===== Catálogo ===== */
const maiores=["Dó","Sol","Ré","Lá","Mi","Si","Fá#","Dó#","Fá","Sib","Mib","Láb","Réb","Solb","Dób"];
const menores=["Lá","Mi","Si","Fá#","Dó#","Sol#","Ré#","Lá#","Ré","Sol","Dó","Fá","Sib","Mib","Láb"];
const seq=(n,f)=>Array.from({length:n},(_,i)=>f(i+1));
const it=(id,secao,grupo,titulo,sub)=>({id,secao,grupo,titulo,sub});
function volume(v,ex,es,hinos=[]){const s="volume"+v,g="Volume "+v;
  return[...seq(ex,i=>it(`${s}-exercicio-${i}`,s,g+" · Exercícios","Exercício "+i,g)),
         ...seq(es,i=>it(`${s}-estudo-${i}`,s,g+" · Estudos","Estudo "+i,g)),
         ...hinos.map(h=>it(`${s}-hino-${h}`,s,g+" · Hinos","Hino "+h,g))]}
const catalogo=[
  ...maiores.map(n=>it("escala-maior-"+n,"escalas","Escalas Maiores",n+" Maior","Escala Maior")),
  ...menores.map(n=>it("escala-menor-"+n,"escalas","Escalas Menores",n+" Menor","Escala Menor")),
  ...seq(480,i=>it("hino-"+i,"hinos","Hinos","Hino "+i,"Hino")),
  ...seq(5,i=>it("coro-"+i,"hinos","Coros","Coro "+i,"Coro")),
  ...volume(1,22,40,[131,158,468]),...volume(2,20,30),...volume(3,10,25),...volume(4,10,12),
  ...seq(16,i=>it("msa-"+i,"msa","MSA · Fases","Fase "+i,"MSA")),
  ...seq(113,i=>it("msa-exercicio-"+i,"msa","MSA · Exercícios","Exercício "+i,"MSA"))];
const porId=Object.fromEntries(catalogo.map(i=>[i.id,i]));
const secoes=[
  {k:"msa",nome:"MSA",cor:"#38bdf8"},{k:"escalas",nome:"escalas",cor:"#e040fb"},
  {k:"hinos",nome:"hinos",cor:"#fb923c"},{k:"volume1",nome:"Volume 1",cor:"#3b82f6"},
  {k:"volume2",nome:"Volume 2",cor:"#fb923c"},{k:"volume3",nome:"Volume 3",cor:"#e040fb"},
  {k:"volume4",nome:"Volume 4",cor:"#6ee7b7"}];
/* Contador de hinos considera só o grupo "Hinos" (coros ficam fora dos 480). */
const conta=k=>catalogo.filter(i=>i.secao===k&&i.grupo!=="Coros");

/* ===== Armazenamento ===== */
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let user=ls.get("orn:sessao",null), tab="hoje", view=null;
const regs=()=>ls.get("orn:regs:"+user,[]);
const salvaRegs=r=>ls.set("orn:regs:"+user,r);
const hoje=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const feitos=()=>new Set(regs().filter(r=>r.resultado==="passou").map(r=>r.itemId));

/* ===== Telas ===== */
const app=document.getElementById("app"),nav=document.getElementById("nav");
let modoCadastro=false, resultado="passou";

function render(){
  nav.hidden=!user;
  if(!user)return login();
  nav.innerHTML=[["hoje","🏠","Hoje"],["progresso","🏆","Progresso"],["config","⚙️","Configurações"]]
    .map(([k,i,n])=>`<button class="${tab===k&&!view?"on":""}" onclick="go('${k}')">${i}<br>${n}</button>`).join("");
  if(view?.t==="lista")return lista();
  if(view?.t==="registro")return registro();
  if(view?.t==="cal")return cal();
  if(view?.t==="dia")return dia();
  ({hoje:telaHoje,progresso:telaProgresso,config:telaConfig})[tab]();
}
function go(k){tab=k;view=null;render();scrollTo(0,0)}

function login(){
  app.innerHTML=`<div style="text-align:center;margin-top:40px"><div style="font-size:56px;color:var(--pk)">♪</div>
  <h1>${modoCadastro?"Criar conta":"Bem-vindo de volta"}</h1></div><div style="margin-top:28px">
  <input id="lg" placeholder="Login" autocapitalize="none">
  <input id="sn" type="password" placeholder="Senha">
  ${modoCadastro?'<input id="ins" placeholder="Seu instrumento">':""}
  <p id="erro" class="mut" style="color:#ff8a80;min-height:18px"></p>
  <button class="btn" onclick="entrar()">${modoCadastro?"Cadastrar":"Entrar"}</button>
  <button class="link" onclick="modoCadastro=!modoCadastro;render()">${modoCadastro?"Já tem conta? Entrar":"Não tem uma conta? Cadastre-se"}</button></div>`;
}
function entrar(){
  const lg=lgv("lg").trim(),sn=lgv("sn"),us=ls.get("orn:usuarios",{}),erro=m=>document.getElementById("erro").textContent=m;
  if(!lg||!sn)return erro("Preencha login e senha.");
  if(modoCadastro){
    if(us[lg])return erro("Este login já existe.");
    us[lg]={sn,ins:lgv("ins").trim()};ls.set("orn:usuarios",us);
  }else if(!us[lg]||us[lg].sn!==sn)return erro("Login ou senha incorretos.");
  user=lg;ls.set("orn:sessao",user);tab="hoje";view=null;render();
}
const lgv=id=>document.getElementById(id).value;

function telaHoje(){
  const us=ls.get("orn:usuarios",{})[user]||{},r=regs(),f=feitos();
  const hojeN=r.filter(x=>x.data===hoje()||x.criado===hoje()).length;
  const concl=r.filter(x=>x.resultado==="passou"&&x.data===hoje()).length;
  app.innerHTML=`<div class="top"><div><div class="eyebrow">Organista no ritmo</div><h1>Olá, ${esc(user)}!</h1>
  ${us.ins?`<div class="mut">Instrumento: ${esc(us.ins)}</div>`:""}<div>Um pequeno passo musical para hoje.</div></div>
  <button class="out" title="Sair" onclick="sair()">⎋</button></div>
  <div class="hero"><div class="eyebrow" style="color:#fff">Seu progresso hoje</div><div style="margin-top:14px"><b>${concl}</b>registro(s) de estudo concluídos.</div>
  <button onclick="go('progresso')">Ver detalhes</button></div>
  <h2>Hoje no seu ritmo</h2><div class="grid">
  <button class="tile" onclick="abreCal()"><b style="color:var(--pk)">${pratica()[hoje()]?.p?1:0}</b>prática hoje</button>
  ${secoes.map(s=>{const l=conta(s.k);return `<button class="tile" onclick="abre('${s.k}')"><b style="color:${s.cor}">${l.filter(i=>f.has(i.id)).length}/${l.length}</b>${s.nome}</button>`}).join("")}
  </div>`;
}
function sair(){user=null;ls.set("orn:sessao",null);render()}

function abre(k){view={t:"lista",k};render();scrollTo(0,0)}
function lista(){
  const f=feitos(),nome=secoes.find(s=>s.k===view.k).nome;let g="";
  app.innerHTML=`<button class="back" onclick="go('${tab}')">← Voltar</button><h1 style="text-transform:capitalize">${nome}</h1>`+
  catalogo.filter(i=>i.secao===view.k).map(i=>{
    const h=i.grupo!==g?`<div class="grp">${esc(i.grupo)}</div>`:"";g=i.grupo;
    return h+`<div class="row"><div class="ico">♪</div><div class="t"><b>${esc(i.titulo)}</b><span>${esc(i.sub)}</span></div>
    <button class="mk ${f.has(i.id)?"done":""}" onclick="marcar('${i.id}')">${f.has(i.id)?"✓ Marcado":"Marcar"}</button></div>`}).join("");
}

function marcar(id){view={t:"registro",id,volta:view};resultado="passou";render();scrollTo(0,0)}
function registro(){
  const i=porId[view.id],hist=regs().filter(r=>r.itemId===view.id).reverse();
  const R={passou:"✓ Passou",nao_passou:"✕ Não passou",em_avaliacao:"⏳ Em avaliação"};
  app.innerHTML=`<button class="back" onclick="view=view.volta;render()">← Voltar</button>
  <h1>Registrar progresso</h1><div class="mut">${esc(i.titulo)} · ${esc(i.sub)}</div>
  <label>Resultado</label><div class="seg">${Object.entries(R).map(([k,n])=>`<button class="${resultado===k?"on":""}" onclick="resultado='${k}';render()">${n}</button>`).join("")}</div>
  <label>Data que foi passada / Conclusão</label><input id="dt" type="date" value="${hoje()}">
  <label>Anotações</label><textarea id="an" placeholder="Descreva dificuldades, evolução, o que revisar..."></textarea>
  <button class="btn" onclick="salvar()">Salvar</button>
  <h2>Histórico</h2>${hist.length?hist.map(r=>`<div class="hist"><b>${R[r.resultado]}</b> · ${r.data.split("-").reverse().join("/")}<br><span class="mut">${esc(r.anotacoes||"Sem anotações")}</span></div>`).join(""):'<div class="mut">Nenhum registro anterior.</div>'}`;
}
function salvar(){
  const d=document.getElementById("dt").value||hoje(),a=document.getElementById("an").value;
  const r=regs();r.push({itemId:view.id,resultado,data:d,anotacoes:a,criado:hoje()});salvaRegs(r);
  view=view.volta;render();
}

function telaProgresso(){
  const f=feitos(),r=regs();
  app.innerHTML=`<h1>Progresso</h1><div class="mut">${r.length} registro(s) no total · ${f.size} item(ns) concluído(s)</div><h2>Por seção</h2>`+
  secoes.map(s=>{const l=conta(s.k),n=l.filter(i=>f.has(i.id)).length,p=Math.round(n/l.length*100);
    return `<div class="row" style="display:block;cursor:pointer" onclick="abre('${s.k}')"><div style="display:flex;justify-content:space-between"><b style="text-transform:capitalize">${s.nome}</b><span class="mut">${n}/${l.length}</span></div>
    <div style="height:8px;background:#333;border-radius:9px;margin-top:10px"><div style="height:8px;width:${p}%;background:${s.cor};border-radius:9px"></div></div></div>`}).join("");
}
function telaConfig(){
  app.innerHTML=`<h1>Configurações</h1><div class="mut">Conectado como ${esc(user)}</div>
  <h2>Ficha e backup</h2><p class="mut">A ficha reúne seus registros de estudo, o calendário de práticas e o progresso por seção.</p>
  <button class="btn" onclick="nuvem()">☁️ Salvar na nuvem</button>
  <button class="btn" style="margin-top:10px" onclick="baixar()">⬇️ Baixar ficha</button>
  <button class="btn" style="margin-top:10px" onclick="imprimir()">🖨️ Imprimir ficha</button>
  <button class="link" onclick="document.getElementById('rest').click()">Restaurar backup de um arquivo</button>
  <input id="rest" type="file" accept=".json,application/json" hidden onchange="restaurar(this)">
  <p id="msg" class="mut" style="min-height:18px"></p>
  ${instalador?'<button class="btn" style="margin-bottom:14px" onclick="instalar()">📲 Instalar aplicativo</button>':""}
  <h2>Dados</h2><p class="mut">Os registros ficam salvos neste navegador. Faça backup com frequência.</p>
  <button class="btn" onclick="sair()">Sair</button>
  <button class="link" style="color:#ff8a80" onclick="if(confirm('Apagar todos os seus registros e o calendário de práticas?')){salvaRegs([]);salvaPratica({});render()}">Apagar meus registros</button>`;
}
/* ===== Calendário de prática ===== */
const pratica=()=>ls.get("orn:pratica:"+user,{});
const salvaPratica=p=>ls.set("orn:pratica:"+user,p);
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const pad=n=>String(n).padStart(2,"0");
const fmt=d=>d.split("-").reverse().join("/");
let pr=true,notaTmp="";
function abreCal(){view={t:"cal",ano:+hoje().slice(0,4)};render();scrollTo(0,0)}
function cal(){
  const p=pratica(),a=view.ano,h=hoje();let sim=0,nao=0;
  Object.keys(p).forEach(d=>{if(d.startsWith(a+"-"))p[d].p?sim++:nao++});
  app.innerHTML=`<button class="back" onclick="go('hoje')">← Voltar</button>
  <div class="top" style="align-items:center"><button class="out" onclick="view.ano--;render()">‹</button><h1>${a}</h1><button class="out" onclick="view.ano++;render()">›</button></div>
  <div class="mut" style="text-align:center">${sim} dia(s) com prática · ${nao} sem prática</div>
  <div class="leg"><span><i style="background:#1f6f54"></i>Praticou</span><span><i style="background:#7a2a2a"></i>Não praticou</span><span><i style="background:#555"></i>Sem registro</span></div>
  <div class="meses">${MESES.map((m,mi)=>{
    const ini=new Date(a,mi,1).getDay(),dias=new Date(a,mi+1,0).getDate();
    let c=["D","S","T","Q","Q","S","S"].map(x=>`<i class="wd">${x}</i>`).join("")+"<i></i>".repeat(ini);
    for(let d=1;d<=dias;d++){const k=`${a}-${pad(mi+1)}-${pad(d)}`,r=p[k];
      c+=`<button class="dia${r?(r.p?" sim":" nao"):""}${r&&r.n?" nt":""}${k===h?" hj":""}" onclick="abreDia('${k}')">${d}</button>`}
    return `<div class="mes"><b>${m}</b><div class="cg">${c}</div></div>`}).join("")}</div>`;
}
function abreDia(k){const r=pratica()[k];pr=r?r.p:true;notaTmp=r?r.n||"":"";view={t:"dia",k,volta:view};render();scrollTo(0,0)}
function dia(){
  const k=view.k,tem=!!pratica()[k];
  app.innerHTML=`<button class="back" onclick="view=view.volta;render()">← Voltar</button>
  <h1>Prática do dia</h1><div class="mut">${fmt(k)}</div>
  <label>Você praticou?</label><div class="seg">
  <button class="${pr?"on":""}" onclick="pr=true;render()">✓ Praticou</button>
  <button class="${!pr?"on":""}" onclick="pr=false;render()">✕ Não praticou</button></div>
  <label>Anotações da prática</label>
  <textarea oninput="notaTmp=this.value" placeholder="O que estudou, dificuldades, o que revisar...">${esc(notaTmp)}</textarea>
  <button class="btn" onclick="salvaDia()">Salvar</button>
  ${tem?'<button class="link" style="color:#ff8a80" onclick="apagaDia()">Remover este dia</button>':""}`;
}
function salvaDia(){const p=pratica();p[view.k]={p:pr,n:notaTmp.trim()};salvaPratica(p);view=view.volta;render()}
function apagaDia(){const p=pratica();delete p[view.k];salvaPratica(p);view=view.volta;render()}

/* ===== Ficha: nuvem, download, impressão, restauração ===== */
const aviso=m=>{const e=document.getElementById("msg");if(e)e.textContent=m};
function dados(){const us=ls.get("orn:usuarios",{})[user]||{};
  return{app:"Organista no Ritmo",versao:1,exportado:new Date().toISOString(),usuario:user,instrumento:us.ins||"",registros:regs(),pratica:pratica()}}
function arquivo(){return new File([JSON.stringify(dados(),null,2)],`organista-no-ritmo-${user}-${hoje()}.json`,{type:"application/json"})}
function baixar(){const f=arquivo(),u=URL.createObjectURL(f),a=document.createElement("a");
  a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
  aviso("Ficha baixada: "+f.name)}
async function nuvem(){
  const f=arquivo();
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){
    await navigator.share({files:[f],title:"Backup Organista no Ritmo"});
    return aviso("Na janela que abriu, escolha Google Drive, iCloud, OneDrive ou outro app de nuvem.")}}
  catch(e){if(e&&e.name==="AbortError")return}
  baixar();aviso("Este navegador não abre o menu de compartilhamento. A ficha foi baixada: envie o arquivo para seu Google Drive, iCloud ou OneDrive.")}
function restaurar(el){
  const fl=el.files[0];if(!fl)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);
    if(!Array.isArray(d.registros)||typeof d.pratica!=="object")throw 0;
    if(!confirm("Substituir seus dados atuais pelos do arquivo?"))return;
    salvaRegs(d.registros);salvaPratica(d.pratica||{});aviso("Backup restaurado.")}
  catch{aviso("Arquivo inválido. Use um arquivo .json baixado pelo aplicativo.")}};
  rd.readAsText(fl)}
function imprimir(){
  const us=ls.get("orn:usuarios",{})[user]||{},r=regs(),p=pratica(),f=feitos();
  const R={passou:"Passou",nao_passou:"Não passou",em_avaliacao:"Em avaliação"};
  const resumo=secoes.map(s=>{const l=conta(s.k);return `<tr><td>${esc(s.nome)}</td><td>${l.filter(i=>f.has(i.id)).length}/${l.length}</td></tr>`}).join("");
  const regsH=[...r].sort((a,b)=>a.data<b.data?-1:1).map(x=>{const i=porId[x.itemId];
    return `<tr><td>${fmt(x.data)}</td><td>${esc(i?i.titulo+" ("+i.sub+")":x.itemId)}</td><td>${R[x.resultado]||""}</td><td>${esc(x.anotacoes||"")}</td></tr>`}).join("");
  const diasH=Object.keys(p).sort().map(d=>`<tr><td>${fmt(d)}</td><td>${p[d].p?"Praticou":"Não praticou"}</td><td>${esc(p[d].n||"")}</td></tr>`).join("");
  document.getElementById("print").innerHTML=`<h1>Ficha · Organista no Ritmo</h1>
  <p>Aluno: <b>${esc(user)}</b>${us.ins?" · Instrumento: "+esc(us.ins):""}<br>Emitida em ${fmt(hoje())}</p>
  <h2>Progresso por seção</h2><table><tr><th>Seção</th><th>Concluídos</th></tr>${resumo}</table>
  <h2>Registros de estudo</h2><table><tr><th>Data</th><th>Item</th><th>Resultado</th><th>Anotações</th></tr>${regsH||'<tr><td colspan="4">Nenhum registro.</td></tr>'}</table>
  <h2>Calendário de prática</h2><table><tr><th>Data</th><th>Situação</th><th>Anotações</th></tr>${diasH||'<tr><td colspan="3">Nenhum dia registrado.</td></tr>'}</table>`;
  window.print();
}
/* ===== Instalação (PWA) ===== */
let instalador=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();instalador=e;if(user&&tab==="config"&&!view)render()});
window.addEventListener("appinstalled",()=>{instalador=null;if(user&&tab==="config"&&!view)render()});
async function instalar(){if(!instalador)return;instalador.prompt();await instalador.userChoice;instalador=null;render()}
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
render();
</script>
